<svg width="1040" height="360" viewBox="0 0 1040 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How ZenTap works</title>
  <desc id="desc">Three steps: tap, speak, tap again to insert text.</desc>
  <rect width="1040" height="360" rx="24" fill="#F7F1E7"/>
  <g transform="translate(86 76)">
    <g>
      <circle cx="54" cy="54" r="54" fill="#E9DFCC"/>
      <circle cx="54" cy="54" r="34" fill="#BFD7CD" stroke="white" stroke-width="2"/>
      <path d="M34 54C48 43 72 44 86 55C69 67 48 66 34 54Z" fill="#486B42"/>
      <text x="54" y="148" text-anchor="middle" fill="#191713" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif" font-size="22" font-weight="700">Tap</text>
      <text x="54" y="179" text-anchor="middle" fill="#71685A" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif" font-size="16">点击开始</text>
    </g>
    <path d="M160 54H292" stroke="#D7CCBA" stroke-width="2" stroke-linecap="round"/>
    <path d="M282 43L294 54L282 65" stroke="#D7CCBA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(334 0)">
      <circle cx="54" cy="54" r="54" fill="#E9DFCC"/>
      <circle cx="54" cy="54" r="34" fill="#BFD7CD" stroke="white" stroke-width="2"/>
      <ellipse cx="54" cy="59" rx="25" ry="10" stroke="white" stroke-opacity=".64" stroke-width="2"/>
      <ellipse cx="54" cy="61" rx="16" ry="6" stroke="white" stroke-opacity=".48" stroke-width="2"/>
      <path d="M32 54C47 42 73 43 88 55C70 69 47 67 32 54Z" fill="#486B42"/>
      <text x="54" y="148" text-anchor="middle" fill="#191713" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif" font-size="22" font-weight="700">Speak</text>
      <text x="54" y="179" text-anchor="middle" fill="#71685A" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif" font-size="16">说出想输入的话</text>
    </g>
    <path d="M494 54H626" stroke="#D7CCBA" stroke-width="2" stroke-linecap="round"/>
    <path d="M616 43L628 54L616 65" stroke="#D7CCBA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(668 0)">
      <circle cx="54" cy="54" r="54" fill="#E9DFCC"/>
      <rect x="24" y="35" width="60" height="42" rx="8" fill="#FBF8F1" stroke="#D7CCBA" stroke-width="2"/>
      <path d="M38 49H70M38 62H60" stroke="#9B2F22" stroke-width="3" stroke-linecap="round"/>
      <text x="54" y="148" text-anchor="middle" fill="#191713" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif" font-size="22" font-weight="700">Insert</text>
      <text x="54" y="179" text-anchor="middle" fill="#71685A" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif" font-size="16">再次点击输入文字</text>
    </g>
  </g>
</svg>
